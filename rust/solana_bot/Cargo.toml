[package]
name = "solana_bot"
version = "0.1.0"
edition = "2021"
description = "Solana MEV arbitrage bot (Raydium / Orca)"

[[bin]]
name = "solana_bot"
path = "src/main.rs"

[dependencies]
solana-client = "1.18"
solana-sdk = "1.18"
solana-transaction-status = "1.18"
spl-token = { version = "4", features = ["no-entrypoint"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
reqwest = { version = "0.11", features = ["json"] }
base64 = "0.21"
bincode = "1"
