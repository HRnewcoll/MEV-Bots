[package]
name = "sandwich_bot"
version = "0.1.0"
edition = "2021"
description = "High-performance EVM sandwich bot"

[[bin]]
name = "sandwich_bot"
path = "src/main.rs"

[dependencies]
ethers = { version = "2", features = ["abigen", "ws", "rustls"] }
tokio = { version = "1", features = ["full"] }
eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
anyhow = "1"
reqwest = { version = "0.11", features = ["json"] }
hex = "0.4"
