[package]
name = "ai_bot"
version = "0.1.0"
edition = "2021"
description = "AI-powered EVM MEV bot using ONNX Runtime for ML inference"

[[bin]]
name = "ai_bot"
path = "src/main.rs"

[dependencies]
ethers = { version = "2", features = ["abigen", "ws", "rustls"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
ndarray = "0.15"
# ONNX Runtime for running exported PyTorch/TensorFlow models
ort = { version = "1.16", features = ["load-dynamic"] }
reqwest = { version = "0.11", features = ["json"] }
