# MEV Bot Dashboard — Docker Compose
#
# Quick start:
#   docker compose up          # start (builds image on first run)
#   docker compose up -d       # start in background
#   docker compose down        # stop and remove containers
#   docker compose logs -f     # follow logs
#
# Dashboard available at: http://localhost:5000

services:
  dashboard:
    build: .
    image: mev-bots:latest
    container_name: mev_bot_dashboard
    ports:
      - "${UI_PORT:-5000}:5000"
    environment:
      # Override any of these via a .env file or shell environment:
      - UI_HOST=0.0.0.0
      - UI_PORT=5000
      - UI_DEBUG=${UI_DEBUG:-false}
    volumes:
      # Persist simulation trade history across container restarts
      - simulator_data:/app/simulator_data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  simulator_data:
    driver: local
